<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LWN · hello world</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f6f7f9;
        color: #1d2433;
      }
      .counter {
        display: grid;
        gap: 16px;
        justify-items: center;
        padding: 32px 48px;
        border-radius: 16px;
        background: white;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.08);
      }
      .counter h1 {
        margin: 0;
        font-size: 20px;
      }
      .counter .row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .counter output {
        min-width: 3ch;
        text-align: center;
        font-size: 40px;
        font-variant-numeric: tabular-nums;
      }
      .counter button {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        font-size: 22px;
        background: #3b5bdb;
        color: white;
        cursor: pointer;
      }
      .counter button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .counter small {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
